name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance; no stored npm token

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Publishes only after a reviewer approves this environment's deployment.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test

      # Runs on every trigger: a workflow_dispatch only publishes when run from a
      # tag whose name matches package.json, so manual runs can't publish an
      # arbitrary branch's version outside a release.
      - name: Verify ref matches package.json version
        run: |
          REF="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          [ "$REF" = "$PKG" ] || { echo "Ref $REF does not match package.json $PKG; run from tag v$PKG"; exit 1; }

      # npm, not yarn, performs the OIDC token exchange for trusted publishing.
      - run: npm publish --provenance --access public
